<title>fitspot Bielefeld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Ein-Bildschirm-App. Kopf mit Filtern, Karte/Feed füllt die Mitte, Tab-Leiste unten. Pins zeigen Sucher-Ecken wie ein Kamera-Display. */
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --ink:#12141B; --muted:#5B6170; --line:#DCDFE5;
  --accent:#2B4BFF; --accent-ink:#FFFFFF; --accent-soft:#E3E8FF;
  --land:#ECEBE5; --forest:#CADBC1; --park:#D5E5CB; --water:#B8D4E8; --road:#FFFFFF; --road-edge:#D2D0C8; --rail:#8A8F9A; --label:#4A4F5C;
  --on-photo:#FFFFFF; --scrim:rgba(8,9,14,.72);
  --c-urban:#FF6B3D; --c-tuer:#E0478C; --c-natur:#3AA35A; --c-cafe:#C48A3A; --c-industrial:#B5523B; --c-treppe:#7A6CF0; --c-nacht:#14B4D4; --c-architektur:#6E7E95;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px)); --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E0F14; --surface:#191B22; --ink:#ECEEF3; --muted:#9AA0AE; --line:#2B2E38;
  --accent:#8193FF; --accent-ink:#0E0F14; --accent-soft:#252B4A;
  --land:#1A1C21; --forest:#20302A; --park:#22332B; --water:#1B2E3C; --road:#30333C; --road-edge:#24262D; --rail:#5A5F6A; --label:#A3A9B6;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E0F14; --surface:#191B22; --ink:#ECEEF3; --muted:#9AA0AE; --line:#2B2E38;
  --accent:#8193FF; --accent-ink:#0E0F14; --accent-soft:#252B4A;
  --land:#1A1C21; --forest:#20302A; --park:#22332B; --water:#1B2E3C; --road:#30333C; --road-edge:#24262D; --rail:#5A5F6A; --label:#A3A9B6;
  color-scheme:dark }

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);max-width:560px;margin:0 auto;background:var(--bg);position:relative}

/* Kopf */
header{background:var(--surface);border-bottom:1px solid var(--line);padding-top:10px;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em;line-height:1}
.brand b{color:var(--accent)}
.city{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--bg);font-weight:600;font-size:13px}
.city svg{width:14px;height:14px}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px var(--gut-r) 12px var(--gut-l);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--bg)}

main{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0}

/* Karte */
#map{position:absolute;inset:0;background:var(--land);touch-action:none;overflow:hidden;cursor:grab}
#map:active{cursor:grabbing}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;transform-origin:0 0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--label);white-space:nowrap;translate:-50% -50%;opacity:.85}
.lbl.water{font-style:italic;text-transform:none;letter-spacing:.02em;color:var(--water);filter:brightness(.6)}
.lbl.forest{font-style:italic;text-transform:none;letter-spacing:.02em;opacity:.7}
.pin{position:absolute;left:0;top:0;pointer-events:auto;translate:-50% -50%;width:18px;height:18px;border-radius:50%;background:var(--c);border:2.5px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35);padding:0;transition:width .18s,height .18s,border-radius .18s}
#map.big .pin{width:46px;height:46px;border-radius:12px;border:3px solid var(--c);background-color:var(--surface);background-size:cover;background-position:center}
.pin.sel{z-index:3;width:26px;height:26px}
#map.big .pin.sel{width:62px;height:62px}
.pin.sel::after{content:"";position:absolute;inset:-7px;border-radius:inherit;border:2px solid var(--ink);opacity:.8}
.me{position:absolute;left:0;top:0;translate:-50% -50%;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 0 var(--accent);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}80%,100%{box-shadow:0 0 0 18px transparent}}
.mapctl{position:absolute;right:calc(var(--gut-r) - 4px);top:12px;display:flex;flex-direction:column;gap:8px}
.mapctl button{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mapctl svg{width:20px;height:20px}
.attrib{position:absolute;left:var(--gut-l);top:12px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:4px 8px;border-radius:6px}

/* Vorschau-Karte auf der Karte */
.peek{position:absolute;left:var(--gut-l);right:var(--gut-r);bottom:14px;display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.18);text-align:left;width:auto}
.peek img{width:76px;height:96px;object-fit:cover;border-radius:12px;flex:none;background:var(--bg)}
.peek .t{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.peek h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-wrap:balance}
.meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.peek .go{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.peek .go svg{width:18px;height:18px}

/* Feed */
#feed{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.fi{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#111}
.fi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder{position:absolute;inset:18px;pointer-events:none;--k:22px;background:
  linear-gradient(var(--on-photo),var(--on-photo)) 0 0/var(--k) 2px no-repeat,linear-gradient(var(--on-photo),var(--on-photo)) 0 0/2px var(--k) no-repeat,
  linear-gradient(var(--on-photo),var(--on-photo)) 100% 0/var(--k) 2px no-repeat,linear-gradient(var(--on-photo),var(--on-photo)) 100% 0/2px var(--k) no-repeat,
  linear-gradient(var(--on-photo),var(--on-photo)) 0 100%/var(--k) 2px no-repeat,linear-gradient(var(--on-photo),var(--on-photo)) 0 100%/2px var(--k) no-repeat,
  linear-gradient(var(--on-photo),var(--on-photo)) 100% 100%/var(--k) 2px no-repeat,linear-gradient(var(--on-photo),var(--on-photo)) 100% 100%/2px var(--k) no-repeat;opacity:.55}
.fi .cap{position:absolute;left:0;right:0;bottom:0;padding:70px var(--gut-r) 22px var(--gut-l);background:linear-gradient(transparent,var(--scrim));color:var(--on-photo);display:flex;align-items:flex-end;gap:12px}
.fi .cap .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.fi h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.fi .meta{color:var(--on-photo);opacity:.85}
.fi .tag{color:var(--on-photo);background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.fi .acts{display:flex;flex-direction:column;gap:14px;align-items:center}
.fab{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);color:var(--on-photo);display:grid;place-items:center}
.fab svg{width:22px;height:22px}
.fab.on{background:var(--on-photo);color:#E0478C}
.fab small{display:block;font-size:11px;font-family:var(--f-mono)}
.acts .n{font-family:var(--f-mono);font-size:11px;margin-top:-10px;opacity:.9}
.feedbar{position:absolute;top:12px;left:50%;translate:-50% 0;z-index:2;display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px)}
.feedbar button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:rgba(255,255,255,.8)}
.feedbar button[aria-pressed="true"]{background:var(--on-photo);color:#12141B}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px var(--gut-r) 24px var(--gut-l);color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:20px;margin:0 0 6px}

/* Seiten (Hochladen, Gemerkt) */
.page{overflow-y:auto;padding:20px var(--gut-r) 32px var(--gut-l)}
.page h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
.page .sub{color:var(--muted);margin:0 0 20px;line-height:1.5;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--line)}
.card b{font-size:14px;line-height:1.25}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field > span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drop{display:grid;place-items:center;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:18px;background:var(--surface);color:var(--muted);text-align:center;cursor:pointer;overflow:hidden;position:relative}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop svg{width:32px;height:32px;margin:0 auto 6px;display:block}
input[type=text]{font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.wrapchips{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;text-decoration:none;box-sizing:border-box}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.checks{list-style:none;padding:0;margin:18px 0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;opacity:.4;transition:opacity .25s}
.checks li.on{opacity:1}
.checks li .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.checks li.done .st{background:var(--c-natur);border-color:var(--c-natur);color:#fff}
.checks .r{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* Detail-Sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:560px;translate:-50% 105%;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;transition:translate .32s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.open{translate:-50% 0}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0}
.car::-webkit-scrollbar{display:none}
.car figure{flex:none;width:100%;margin:0;scroll-snap-align:center;position:relative;aspect-ratio:4/4.4;max-height:56vh;background:#111}
.car img{width:100%;height:100%;object-fit:cover;display:block}
.car figcaption{position:absolute;left:12px;bottom:12px;font-family:var(--f-mono);font-size:11px;color:var(--on-photo);background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px}
.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,width .2s}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}
.close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:var(--on-photo);display:grid;place-items:center;z-index:2}
.close svg{width:18px;height:18px}
.sbody{padding:8px var(--gut-r) 0 var(--gut-l);display:flex;flex-direction:column;gap:14px}
.sbody h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:27px;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
.sbody p{margin:0;line-height:1.55;max-width:62ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;padding:14px;border-radius:16px;background:var(--bg);font-size:14px}
.facts dt{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.facts dd{margin:0}
.facts .mono{font-family:var(--f-mono);font-size:12.5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soon{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;font-size:13.5px;color:var(--muted)}
.soon b{color:var(--ink)}

/* Tabs */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px var(--gut-r) 6px var(--gut-l);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:500;color:var(--muted)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--accent)}
.tab.plus span.ic{width:40px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tab.plus span.ic svg{width:20px;height:20px;color:var(--accent-ink)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));translate:-50% 20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,translate .2s;z-index:40;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;translate:-50% 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header>
    <div class="top">
      <div class="brand">fit<b>spot</b></div>
      <button class="city" id="city" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Bielefeld</button>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Filter"></div>
  </header>

  <main>
    <section class="view" id="v-map">
      <div id="map">
        <svg id="mapsvg" aria-hidden="true"></svg>
        <div id="overlay"></div>
      </div>
      <div class="attrib">Karte vereinfacht · Beispiel-Spots</div>
      <div class="mapctl">
        <button type="button" id="zin" aria-label="Hineinzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" id="zout" aria-label="Herauszoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button type="button" id="zme" aria-label="Zu meinem Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
      </div>
      <button class="peek" id="peek" type="button" hidden></button>
    </section>

    <section class="view" id="v-feed" hidden>
      <div class="feedbar" role="group" aria-label="Sortierung">
        <button type="button" data-sort="near" aria-pressed="true">In der Nähe</button>
        <button type="button" data-sort="top" aria-pressed="false">Beliebt</button>
      </div>
      <div class="view" id="feed"></div>
    </section>

    <section class="view page" id="v-add" hidden></section>
    <section class="view page" id="v-saved" hidden></section>
  </main>

  <nav class="tabs" aria-label="Bereiche">

    <button class="tab" data-v="feed" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M5 15l4-4 4 4 2-2 4 4"/></svg>Feed</button>
    <button class="tab plus" data-v="add" type="button"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Hochladen</button>
    <button class="tab" data-v="saved" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>Gemerkt</button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Spot-Details"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Daten ---------- */
const CATS={
  urban:{l:'Urban & Street'}, tuer:{l:'Türen'}, natur:{l:'Natur'}, cafe:{l:'Café'},
  industrial:{l:'Industrial'}, treppe:{l:'Treppen'}, nacht:{l:'Nacht & Neon'}, architektur:{l:'Architektur'}
};
const TIPS={
  tuer:['Vormittag, weiches Seitenlicht','50 mm · f/2.8 · frontal, Tür mittig'],
  urban:['Später Nachmittag, harte Schatten','28 mm · f/4 · tief ansetzen'],
  natur:['Golden Hour, ca. 1 h vor Sonnenuntergang','85 mm · f/1.8 · gegen die Sonne'],

  <p>${esc(s.desc)}</p>
  <dl class="facts"><dt>Beste Zeit</dt><dd>${esc(best)}</dd><dt>Foto-Tipp</dt><dd class="mono">${esc(tip)}</dd><dt>Position</dt><dd class="mono">${s.lat.toFixed(4)}° N, ${s.lon.toFixed(4)}° O</dd></dl>
  <div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=walking"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg>Route</a>
  <button type="button" class="btn ghost" id="sv">${saved.has(s.id)?'Gemerkt ✓':'Merken'}</button></div>
  <button type="button" class="btn ghost" id="onmap">Auf der Karte zeigen</button>
  <div class="soon"><span><b>Outfit-Fotos von anderen</b> an diesem Spot und Social Credits kommen in der nächsten Version.</span></div></div>`;
  sheet.querySelector('.close').onclick=closeSheet;
  sheet.querySelector('#sv').onclick=e=>{toggleSave(s);e.currentTarget.textContent=saved.has(s.id)?'Gemerkt ✓':'Merken'};
  sheet.querySelector('#onmap').onclick=()=>{closeSheet();showOnMap(s)};
  const car=sheet.querySelector('.car'),dots=sheet.querySelectorAll('.dots i');car.onscroll=()=>{const i=Math.round(car.scrollLeft/car.clientWidth);dots.forEach((d,k)=>d.classList.toggle('on',k===i))};
  sheet.scrollTop=0;sheet.classList.add('open');bd.classList.add('open');
}
function closeSheet(){sheet.classList.remove('open');bd.classList.remove('open')}
bd.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function showOnMap(s){if(state.filters.size&&!s.cats.some(c=>state.filters.has(c))){state.filters.clear();renderChips();refresh()}setView('map');centerOn(s.xy,Math.max(V.s,300));select(s)}

/* ---------- Hochladen ---------- */
let up_img=null,up_cats=new Set();
function buildAdd(){
  const el=$('#v-add');up_img=null;up_cats=new Set();
  el.innerHTML=`<h2>Spot hochladen</h2><p class="sub">So schnell wie ein Inserat: Foto, Name, Kategorie. Die App prüft den Spot danach automatisch.</p>
  <div class="field"><span>Foto</span><label class="drop" id="drop"><input type="file" accept="image/*" id="file" hidden><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto aufnehmen oder auswählen</div></label></div>
  <div class="field"><span>Name des Spots</span><input type="text" id="uname" maxlength="48" placeholder="z. B. Grüne Tür in der Weststraße"></div>
  <div class="field"><span>Kategorie</span><div class="wrapchips" id="ucats"></div></div>
  <p class="hint">Der Spot wird an der aktuellen Kartenmitte eingetragen. Schieb die Karte vorher an die richtige Stelle. In der echten App kommt der Ort aus dem GPS des Fotos.</p>
  <button type="button" class="btn" id="usend" disabled>Spot prüfen &amp; veröffentlichen</button>
  <ul class="checks" id="checks" hidden></ul>`;
  const uc=el.querySelector('#ucats');Object.entries(CATS).forEach(([k,c])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed','false');b.innerHTML=`<i style="--c:var(--c-${k})"></i>${esc(c.l)}`;b.onclick=()=>{up_cats.has(k)?up_cats.delete(k):up_cats.add(k);b.setAttribute('aria-pressed',up_cats.has(k));valid()};uc.appendChild(b)});
  el.querySelector('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const W=540,H=720,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const sc=Math.max(W/im.width,H/im.height);x.drawImage(im,(W-im.width*sc)/2,(H-im.height*sc)/2,im.width*sc,im.height*sc);up_img=c.toDataURL('image/jpeg',.72);
    const d=el.querySelector('#drop');d.querySelector('img')?.remove();const p=new Image();p.src=up_img;p.alt='Vorschau';d.appendChild(p);valid()};im.src=rd.result};rd.readAsDataURL(f)};
  el.querySelector('#uname').oninput=valid;
  el.querySelector('#usend').onclick=publish;
}
function valid(){const el=$('#v-add');el.querySelector('#usend').disabled=!(up_img&&up_cats.size&&el.querySelector('#uname').value.trim())}
function publish(){
  const el=$('#v-add'),btn=el.querySelector('#usend'),ul=el.querySelector('#checks');btn.disabled=true;
  const cat=CATS[[...up_cats][0]].l;
  const steps=[['Standort im Foto prüfen','GPS ✓'],['Nach doppelten Bildern suchen','0 Treffer'],['Inhalt prüfen','unbedenklich'],['Kategorie erkennen',cat]];
  ul.hidden=false;ul.innerHTML=steps.map(([t])=>`<li><span class="st"></span>${esc(t)}<span class="r"></span></li>`).join('');
  const lis=ul.querySelectorAll('li');let i=0;
  const next=()=>{if(i>0){lis[i-1].classList.add('done');lis[i-1].querySelector('.st').textContent='✓';lis[i-1].querySelector('.r').textContent=steps[i-1][1]}
    if(i<lis.length){lis[i].classList.add('on');i++;setTimeout(next,650)}else done()};next();
  function done(){
    const lat=LAT0-V.cy/KY,lon=LON0+V.cx/KX;
    const s={id:1000+Date.now()%100000,name:el.querySelector('#uname').value.trim(),cats:[...up_cats],lat,lon,area:'Dein Upload',desc:'Von dir hochgeladen. In dieser Demo nur auf deinem Gerät gespeichert.',likes:0,img:up_img,user:1};
    s.d=dist(ME,s);s.xy=P(lat,lon);spots.push(s);userSpots.push(s);
    const ok=store.set('fs_user',userSpots.slice(-8).map(({d,xy,...r})=>r));
    const b=document.createElement('button');b.type='button';b.className='btn';b.textContent='Spot auf der Karte ansehen';b.style.marginTop='4px';b.onclick=()=>{refresh();showOnMap(s)};ul.after(b);
    toast(ok?'Spot ist online (simulierte Prüfung)':'Spot ist online, wird aber nicht dauerhaft gespeichert');
  }
}

/* ---------- Navigation ---------- */
function setView(v){
  state.view=v;['map','feed','add','saved'].forEach(k=>$('#v-'+k).hidden=k!==v);
  document.querySelectorAll('.tab').forEach(t=>t.dataset.v===v?t.setAttribute('aria-current','page'):t.removeAttribute('aria-current'));
  $('.chips').style.display=(v==='map'||v==='feed')?'':'none';
  if(v==='feed'&&!feed.children.length)buildFeed();if(v==='add')buildAdd();if(v==='saved')buildSaved();if(v==='map')draw();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.v));
function refresh(){const n=visible().length;$('#count').textContent=n+' Spots';if(state.sel&&!visible().includes(state.sel))select(null);buildPins();buildFeed()}
$('#city').onclick=()=>toast('Weitere Städte folgen. Gestartet wird in Bielefeld.');

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

buildMap();renderChips();
const w0=mapEl.clientWidth||400;V.s=Math.max(110,w0/3.4);[V.cx,V.cy]=P(52.0215,8.5310);
refresh();
setTimeout(()=>toast('Prototyp mit Beispiel-Spots. Tippe auf einen Pin.'),500);
})();
</script>
